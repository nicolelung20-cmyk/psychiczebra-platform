name: Vercel + Supabase Gate

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: deploy-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Verify deployment contract
        shell: bash
        run: |
          test -f vercel.json
          test -f .env.example
          grep -q "NEXT_PUBLIC_SUPABASE_URL" .env.example
          grep -q "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY" .env.example
          echo "Vercel/Supabase deployment contract present."

  migration-source-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Check Supabase source layout
        shell: bash
        run: |
          test -f supabase/schema.sql
          echo "Supabase schema source present."
