apiVersion: apps/v1
kind: Deployment
metadata:
  name: psychiczebra-platform
  namespace: elevated-ai
  labels:
    app: psychiczebra-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: psychiczebra-platform
  template:
    metadata:
      labels:
        app: psychiczebra-platform
    spec:
      containers:
        - name: app
          image: ghcr.io/nicolelung20-cmyk/psychiczebra-platform:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - secretRef:
                name: elevated-ai-secrets
                optional: true
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
