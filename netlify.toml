# Netlify's free plan builds and deploys every push to main automatically.
# Netlify detects Next.js and installs its runtime, so API routes and the
# proxy run as functions without extra plugins.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  NEXT_TELEMETRY_DISABLED = "1"
