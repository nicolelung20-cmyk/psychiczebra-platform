<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SupportFlow AI</title><style>body{font:16px system-ui;max-width:760px;margin:3rem auto;padding:0 1rem;color:#182230}input,textarea,button{font:inherit;width:100%;box-sizing:border-box;margin:.4rem 0;padding:.65rem}textarea{min-height:130px}button{background:#2457d6;color:#fff;border:0;border-radius:4px;font-weight:600;cursor:pointer}pre{white-space:pre-wrap;background:#f4f6f8;padding:1rem;border-radius:4px}small{color:#536071}</style></head><body><h1>SupportFlow AI</h1><p>Generate customer-support drafts. Every response requires human review before sending.</p><label>API key<input id="key" type="password" autocomplete="off"></label><label>Customer name<input id="name" value="Customer"></label><label>Support ticket<textarea id="message" placeholder="Paste a customer message"></textarea></label><button id="draft">Create draft</button><pre id="result" aria-live="polite">Ready.</pre><script>const $=id=>document.getElementById(id);$("draft").onclick=async()=>{const result=$("result"),key=$("key").value,headers={"X-API-Key":key};result.textContent="Creating draft…";try{let r=await fetch("/v1/tickets",{method:"POST",headers:{...headers,"Content-Type":"application/json"},body:JSON.stringify({customerName:$("name").value,message:$("message").value})});let j=await r.json();if(!r.ok)throw Error(j.error);for(let i=0;i<20;i++){await new Promise(x=>setTimeout(x,300));r=await fetch("/v1/jobs/"+j.id,{headers});j=await r.json();if(j.status!=="queued"&&j.status!=="processing")break}result.textContent=j.draft?`Draft — review before sending:\n\n${j.draft}`:JSON.stringify(j,null,2)}catch(e){result.textContent="Error: "+e.message}};</script></body></html>
