<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AUTOGROUP 247</title>
<style>
body{font:15px system-ui,-apple-system,sans-serif;max-width:1100px;margin:0 auto;padding:28px;color:#182230;background:#f7f8fa}header{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:24px}.brand{font-size:24px;font-weight:800}.muted{color:#667085}.pill{padding:7px 12px;border-radius:999px;font-weight:800;background:#e8eaed}.GREEN{background:#dff6e7}.AMBER{background:#fff0c2}.RED{background:#ffd9d9}.OFFLINE{background:#e7e9ee}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:#fff;border:1px solid #e4e7ec;border-radius:12px;padding:18px}.label{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:#667085}.value{font-size:25px;font-weight:800;margin-top:6px}.section{margin-top:22px}.account{display:flex;justify-content:space-between;gap:16px;align-items:center;border-top:1px solid #eee;padding:14px 0}.alert{padding:12px;border-left:4px solid #d92d20;background:#fff;margin:8px 0}.ok{padding:16px;background:#fff;border:1px solid #e4e7ec;border-radius:12px}.flow{display:flex;flex-wrap:wrap;gap:8px}.step{padding:8px 10px;border:1px solid #ddd;border-radius:8px;background:#fff}@media(max-width:750px){.grid{grid-template-columns:repeat(2,1fr)}header{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<header><div><div class="brand">AUTOGROUP 247</div><div class="muted">Financial operations & security command center</div></div><div id="status" class="pill OFFLINE">OFFLINE</div></header>
<div class="grid" id="metrics"></div>
<div class="section"><div class="card"><div class="label">Control flow</div><div class="flow" id="flow"></div></div></div>
<div class="section"><div class="card"><h2>Action Center</h2><div id="alerts" class="muted">Loading…</div></div></div>
<div class="section"><div class="card"><h2>Accounts</h2><div id="accounts" class="muted">Loading…</div></div></div>
<div class="section"><div class="ok"><strong>Fail-closed monitoring:</strong> missing, stale, contradictory, or unavailable financial data is never treated as GREEN. Money movement remains authorization-gated.</div></div>
<script>
const money=n=>n==null?'—':new Intl.NumberFormat(undefined,{style:'currency',currency:'USD',maximumFractionDigits:2}).format(n);
async function load(){const key=localStorage.getItem('autogroup_api_key')||'';const headers=key?{'X-API-Key':key}:{};const r=await fetch('/v1/autogroup/status',{headers});if(!r.ok){document.getElementById('alerts').textContent='Dashboard API unavailable or unauthorized.';return}const d=await r.json();const s=document.getElementById('status');s.textContent=d.status;s.className='pill '+d.status;document.getElementById('metrics').innerHTML=[['Accounts',d.totals.accounts],['Verified',d.totals.green],['Available cash',money(d.totals.availableBalance)],['Alerts',d.alerts.length]].map(x=>`<div class="card"><div class="label">${x[0]}</div><div class="value">${x[1]}</div></div>`).join('');document.getElementById('flow').innerHTML=d.controlFlow.map(x=>`<span class="step">${x}</span>`).join(' → ');document.getElementById('alerts').innerHTML=d.alerts.length?d.alerts.map(a=>`<div class="alert"><strong>${a.severity}</strong> · ${a.message}</div>`).join(''):'<div class="ok">No unresolved alerts.</div>';document.getElementById('accounts').innerHTML=d.accounts.length?d.accounts.map(a=>`<div class="account"><div><strong>${a.name}</strong><div class="muted">${a.institution} · last sync ${a.lastSync||'unknown'}</div></div><div><strong>${a.state}</strong><div>${money(a.balance)}</div></div></div>`).join(''):'<div class="ok"><strong>No financial account connectors are configured.</strong><br><span class="muted">The control plane is installed and fail-closed; connect verified account sources before declaring GREEN.</span></div>'}
load();setInterval(load,60000);
</script>
</body></html>
