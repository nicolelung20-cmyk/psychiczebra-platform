<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ANNE · Hermes</title>
<style>
:root{color-scheme:dark;font:16px system-ui;background:#111318;color:#eef0f3}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(ellipse at top,#292d35,#111318 60%)}main{width:min(720px,94vw);height:min(820px,94vh);display:flex;flex-direction:column;border:1px solid #515762;border-radius:24px;background:#1b1e24ef;box-shadow:0 24px 80px #0008;overflow:hidden}header{padding:22px 24px;border-bottom:1px solid #424750;display:flex;justify-content:space-between;align-items:center}h1{font-size:17px;letter-spacing:.12em;margin:0}.muted{color:#aab0ba;font-size:12px}#status{color:#c3c8d0}section{padding:18px 22px;display:flex;gap:8px;border-bottom:1px solid #343942}input,button{font:inherit;border-radius:12px;border:1px solid #535b68;background:#11151b;color:#f2f3f5;padding:12px}input{min-width:0;flex:1}button{cursor:pointer;background:#d8dce2;color:#171a20;border:0;font-weight:650}#messages{padding:20px;flex:1;overflow:auto;display:flex;flex-direction:column;gap:12px}.msg{padding:12px 15px;border-radius:15px;max-width:88%;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.45}.user{align-self:flex-end;background:#d8dce2;color:#171a20}.assistant{align-self:flex-start;background:#2a3039;border:1px solid #454d59}.error{align-self:center;color:#ffb4a9;font-size:13px}footer{display:flex;gap:8px;padding:16px 20px;border-top:1px solid #424750}footer input{flex:1}button:disabled{opacity:.45;cursor:not-allowed}small{display:block;padding:0 22px 12px;color:#9299a4;font-size:11px}
</style></head>
<body><main><header><div><h1>ANNE <span style="color:#9da5b2">× HERMES</span></h1><div class="muted">Private cloud chat · free-only routing</div></div><div id="status">Disconnected</div></header>
<section><input id="token" type="password" autocomplete="off" placeholder="Paste your Supabase session access token"><button id="connect">Connect</button></section>
<div id="messages"><div class="msg assistant">Connect with your existing signed-in Supabase session. Your token is held only in this page's memory and is not saved.</div></div>
<footer><input id="prompt" maxlength="2000" placeholder="Message Hermes…" disabled><button id="send" disabled>Send</button></footer><small>Messages go directly to your existing Hermes gateway. No broadcast, paid fallback, or local Mac required.</small></main>
<script>
const $=id=>document.getElementById(id),messages=$('messages');let socket=null;
function add(text,kind='assistant'){const el=document.createElement('div');el.className='msg '+kind;el.textContent=text;messages.append(el);messages.scrollTop=messages.scrollHeight}
function state(s){$('status').textContent=s}
$('connect').onclick=()=>{const token=$('token').value.trim();if(token.length<20){add('Paste a valid Supabase session access token first.','error');return}socket=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws');socket.onopen=()=>socket.send(JSON.stringify({type:'auth',access_token:token}));socket.onmessage=e=>{const d=JSON.parse(e.data);if(d.type==='authenticated'){$('prompt').disabled=false;$('send').disabled=false;$('token').value='';state('Connected · '+(d.providers?.[0]?.provider||'free-only route'));add('Hermes connected. Free-only policy confirmed.')}else if(d.type==='chat')add(d.text,'assistant');else if(d.type==='error')add(d.message,'error')};socket.onclose=()=>{state('Disconnected');$('prompt').disabled=true;$('send').disabled=true};socket.onerror=()=>add('WebSocket connection failed.','error');state('Connecting…')};
function send(){const text=$('prompt').value.trim();if(!text||!socket||socket.readyState!==1)return;add(text,'user');socket.send(JSON.stringify({type:'chat',text}));$('prompt').value=''}
$('send').onclick=send;$('prompt').addEventListener('keydown',e=>{if(e.key==='Enter')send()});
</script></body></html>
